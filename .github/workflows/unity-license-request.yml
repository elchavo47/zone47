name: Unity lisans dosyasi iste (bir kere)

on:
  workflow_dispatch:

jobs:
  alf:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: alf
        with:
          unityVersion: 6000.3.27f1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.alf.outputs.filePath }}
          path: ${{ steps.alf.outputs.filePath }}
