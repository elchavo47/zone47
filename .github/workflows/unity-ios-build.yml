name: Unity iOS build + TestFlight (bilgisayarsiz)

# Bilgisayar gerekmez: GitHub'da Unity acilir, iOS Xcode projesini uretir, ardindan TestFlight'a gonderir.
# Gerekli ek gizli anahtarlar (Settings > Secrets > Actions): UNITY_USERNAME, UNITY_PASSWORD  (adimlar: UNITY_LISANS.md)
on:
  workflow_dispatch:

jobs:
  unity-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space (Unity images are big)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-

      # GameCI'nin manuel lisans yolu kapandi; Unity'yi ve lisansi kendimiz kuruyoruz (Unity ID ile)
      - name: Install Unity Hub (1st try; the action expects an old Hub path)
        id: hub1
        continue-on-error: true
        uses: RageAgainstThePixel/unity-setup@v1
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: iOS

      - name: Fix Unity Hub path
        if: steps.hub1.outcome == 'failure'
        run: |
          dpkg -L unityhub | grep -i -E "bin|unityhub$" | head -30
          REAL=$(dpkg -L unityhub | grep -E "/(unityhub|unityhub-bin)$" | while read f; do [ -f "$f" ] && [ -x "$f" ] && echo "$f" && break; done)
          [ -z "$REAL" ] && REAL=$(command -v unityhub || true)
          echo "Hub binary: $REAL"
          [ -n "$REAL" ] || { echo "::error::Unity Hub binary not found"; exit 1; }
          sudo mkdir -p /opt/unityhub
          [ "$REAL" = /opt/unityhub/unityhub ] || sudo ln -sf "$REAL" /opt/unityhub/unityhub
          ls -la /opt/unityhub | head

      - name: Install Unity (iOS module)
        uses: RageAgainstThePixel/unity-setup@v1
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: iOS

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v1
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build iOS Xcode project
        uses: RageAgainstThePixel/unity-action@v1
        with:
          build-target: iOS
          log-name: ios-build
          args: -quit -batchmode -nographics -executeMethod Zone47.EditorTools.Z47CIBuild.BuildIOS

      - uses: actions/upload-artifact@v4
        with:
          name: Zone47-xcode-project
          path: build/iOS
          retention-days: 3
          if-no-files-found: error

  testflight:
    needs: unity-build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use the freshly built Xcode project instead of the old ios/ folder
        uses: actions/download-artifact@v4
        with:
          name: Zone47-xcode-project
          path: ios-fresh

      - name: Swap ios/ folder
        run: |
          rm -rf ios && mv ios-fresh ios
          ls ios | head -20

      - name: Select Xcode 26 (App Store requires the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 2[6-9]" || { echo "::error::Xcode 26 bulunamadi"; exit 1; }

      - name: Restore Unity engine library (kept zipped in git, GitHub 100 MB limit)
        run: |
          cd ios/Libraries
          if [ -f libiPhone-lib.zip ]; then unzip -o libiPhone-lib.zip && rm libiPhone-lib.zip; fi
          ls -la libiPhone-lib.a

      - name: Rejoin split build files (GitHub 100 MB per-file limit)
        run: |
          find ios -name '*.z47part00' | while read p; do
            f="${p%.z47part00}"; cat "$f".z47part* > "$f"; rm -f "$f".z47part*; ls -la "$f"
          done

      - name: Install certificate and profile
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p temp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p temp "$KC"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          if ! security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"; then
            echo "Dogrudan import olmadi; p12 OpenSSL 3 ile olusturulmus olabilir, eski formata ceviriliyor..."
            OSSL=$(ls /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl 2>/dev/null | head -1)
            [ -z "$OSSL" ] && { brew install openssl@3 >/dev/null; OSSL=$(brew --prefix openssl@3)/bin/openssl; }
            if ! "$OSSL" pkcs12 -in $RUNNER_TEMP/cert.p12 -passin env:P12_PASSWORD -nodes -out $RUNNER_TEMP/cert.pem 2>$RUNNER_TEMP/ossl.err \
               && ! "$OSSL" pkcs12 -legacy -in $RUNNER_TEMP/cert.p12 -passin env:P12_PASSWORD -nodes -out $RUNNER_TEMP/cert.pem 2>>$RUNNER_TEMP/ossl.err; then
              cat $RUNNER_TEMP/ossl.err
              echo "::error::p12 sifresi yanlis (IOS_P12_PASSWORD) ya da dosya bozuk."
              exit 1
            fi
            "$OSSL" pkcs12 -export -legacy -in $RUNNER_TEMP/cert.pem -out $RUNNER_TEMP/cert2.p12 -passout env:P12_PASSWORD
            security import $RUNNER_TEMP/cert2.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
            rm -f $RUNNER_TEMP/cert.pem
          fi
          security find-identity -v -p codesigning "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k temp "$KC"
          security list-keychain -d user -s "$KC"
          echo "$PROFILE" | base64 --decode > $RUNNER_TEMP/p.mobileprovision
          security cms -D -i $RUNNER_TEMP/p.mobileprovision > $RUNNER_TEMP/p.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/p.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" $RUNNER_TEMP/p.plist)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/p.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "TEAM=$TEAM" >> $GITHUB_ENV

      - name: Configure signing (Unity-iPhone manual, UnityFramework unsigned)
        run: |
          gem list xcodeproj -i >/dev/null || sudo gem install xcodeproj
          cat > $RUNNER_TEMP/sign.rb <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/Unity-iPhone.xcodeproj')
          proj.targets.each do |t|
            t.build_configurations.each do |c|
              s = c.build_settings
              s['ENABLE_BITCODE'] = 'NO'
              s['DEVELOPMENT_TEAM'] = ENV['TEAM']
              s['CODE_SIGN_STYLE'] = 'Manual'
              if t.name == 'Unity-iPhone'
                s['PROVISIONING_PROFILE_SPECIFIER'] = ENV['UUID']
                s['PROVISIONING_PROFILE'] = ENV['UUID']
                s['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
                s['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
                s['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.aydworks.zone47'
              else
                s['PROVISIONING_PROFILE_SPECIFIER'] = ''
                s['CODE_SIGN_IDENTITY'] = ''
                s['CODE_SIGNING_ALLOWED'] = 'NO'
              end
            end
          end
          proj.save
          RUBY
          ruby $RUNNER_TEMP/sign.rb
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Info.plist
          chmod +x ios/*.sh 2>/dev/null || true

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project ios/Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -destination generic/platform=iOS -archivePath $RUNNER_TEMP/Zone47.xcarchive archive | tail -80

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><false/>
            <key>provisioningProfiles</key><dict><key>com.aydworks.zone47</key><string>$UUID</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Zone47.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out
          ls -la $RUNNER_TEMP/out

      - uses: actions/upload-artifact@v4
        with: { name: Zone47-ipa, path: "${{ runner.temp }}/out/*.ipa", retention-days: 7 }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/out/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
